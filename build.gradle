plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()

    repositories {
        exclusiveContent {
            forRepository {
                maven {url "https://cursemaven.com"}
            }
            filter {
                includeGroup "curse.maven"
            }
        }
    }
}

dependencies {
    implementation "curse.maven:jupiter-1072905:8621734"

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // JEI 29.21.0.67 is the 26.1.2
    implementation "curse.maven:jei-238222:8601603"
    // Sodium 0.9.2-alpha.4 for NeoForge 26.1.2
    implementation "curse.maven:sodium-394468:8591754"
    // Jade-mc26.1-NeoForge-26.1.8
    implementation "curse.maven:jade-324717:8326300"
    //jei_structures-26.1.2-neoforge-1.8
    runtimeOnly "curse.maven:jei-structures-1568462:8581241"
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        testedMod = mods.getByName(mod_id)
        enable()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}


var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_min_version        : neo_min_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.named('test', Test).configure {
    useJUnitPlatform {
        excludeTags 'generated-resources'
    }
}

tasks.register('resourceTest', Test) { resourceTest ->
    def unitTest = tasks.named('test', Test).get()
    unitTest.copyTo(resourceTest)
    resourceTest.jvmArgumentProviders.addAll(unitTest.jvmArgumentProviders)
    dependsOn tasks.named('downloadAssets'), tasks.named('prepareNeoForgeTestFiles'), tasks.named('runData')
    description = 'Validates resources produced by runData.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'generated-resources'
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('resourceTest')
}

def generatedExclusiveRuntimeTrees = [
        'data/infx/worldgen',
        'data/infx/neoforge',
        'data/infx/dimension',
        'data/infx/dimension_type',
        'data/minecraft/worldgen',
        'data/minecraft/dimension',
        'data/minecraft/dimension_type',
        'data/minecraft/tags',
]

def copyRuntimeGeneratedResources = tasks.register('copyRuntimeGeneratedResources', Copy) {
    dependsOn tasks.named('runData')
    from layout.projectDirectory.dir('src/generated/resources')
    into layout.buildDirectory.dir('resources/main')
    exclude '.cache/**'
}

def syncExclusiveGeneratedResources = generatedExclusiveRuntimeTrees.collect { relativePath ->
    tasks.register("syncGenerated_${relativePath.replace('/', '_')}", Sync) {
        dependsOn copyRuntimeGeneratedResources
        from layout.projectDirectory.dir("src/generated/resources/${relativePath}")
        into layout.buildDirectory.dir("resources/main/${relativePath}")
        // Destination extras (stale JSON left by prior Copy) must always be pruned.
        outputs.upToDateWhen { false }
    }
}

def prepareRuntimeGeneratedResources = tasks.register('prepareRuntimeGeneratedResources') {
    dependsOn copyRuntimeGeneratedResources
    dependsOn syncExclusiveGeneratedResources
}

tasks.named('runClient').configure {
    dependsOn prepareRuntimeGeneratedResources
}

tasks.named('runGameTestServer').configure {
    dependsOn prepareRuntimeGeneratedResources
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
